<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Sin conexión · Carpintería</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #17263A; color: #F4F1EA;
               font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
        h1 { font-size: 1.4rem; margin: 0 0 .5rem; }
        p { margin: 0 0 1.5rem; color: #C9D3DF; line-height: 1.5; }
        button { background: #E3C27A; color: #17263A; border: 0; border-radius: 10px; padding: 14px 28px; font-size: 1rem; font-weight: 600; }
        .canto { width: 56px; height: 6px; background: #E3C27A; border-radius: 3px; margin: 0 auto 1.25rem; }
    </style>
</head>
<body>
    <main>
        <div class="canto"></div>
        <h1>No hay conexión</h1>
        <p>Revisá el wifi o los datos del celular y volvé a intentar.</p>
        <button onclick="location.href = window.CARPINTERIA_URL">Reintentar</button>
    </main>
    <script src="destino.js"></script>
</body>
</html>
