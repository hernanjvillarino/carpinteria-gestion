<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sin conexión</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #faf6f1; color: #292524; display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 1rem; text-align: center; }
        img { width: 72px; height: 72px; border-radius: 16px; }
        button { margin-top: 1rem; padding: .6rem 1.2rem; border: 0; border-radius: .4rem; background: #8b5a2b; color: #fff; font-size: 1rem; }
    </style>
</head>
<body>
    <main>
        <img src="/icons/icon-192.png" alt="">
        <h1>Sin conexión</h1>
        <p>No hay internet en este momento. Cuando vuelva la señal, tocá el botón.</p>
        <button onclick="location.reload()">Reintentar</button>
    </main>
</body>
</html>
